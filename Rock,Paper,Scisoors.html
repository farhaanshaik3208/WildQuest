
<!doctype HTML>
<html>
<head>
  <title>Rock Paper Scissors</title>
</head>

<body style="font-family:Arial; text-align:center; background:#f0f8ff;">

<h1>🎉 Rock Paper Scissors 🎉</h1>
<p>Choose one to play!</p>

<button onclick="play('rock')" style="font-size:30px; padding:10px;">🪨 Rock</button>
<button onclick="play('paper')" style="font-size:30px; padding:10px;">📄 Paper</button>
<button onclick="play('scissors')" style="font-size:30px; padding:10px;">✂️ Scissors</button>

<h2 id="result" style="margin-top:30px;"></h2>

<script>
function play(playerChoice) {
  const choices = ["rock", "paper", "scissors"];
  const computerChoice = choices[Math.floor(Math.random() * 3)];

  let message = "";

  if (playerChoice === computerChoice) {
    message = "It's a tie! Great job!";
  } else if (
    (playerChoice === "rock" && computerChoice === "scissors") ||
    (playerChoice === "paper" && computerChoice === "rock") ||
    (playerChoice === "scissors" && computerChoice === "paper")
  ) {
    message = "You win! Awesome!";
  } else {
    message = "Computer wins! Nice try!";
  }

  document.getElementById("result").innerHTML =
    "You chose: " + playerChoice +
    "<br>Computer chose: " + computerChoice +
    "<br><br>" + message;
}
</script>

</body>
</html>
